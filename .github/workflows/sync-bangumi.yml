name: Sync popular Bangumi catalog

on:
  workflow_dispatch:
  schedule:
    # Monday 06:17 in Asia/Shanghai. GitHub may start scheduled jobs later.
    - cron: "17 22 * * 0"

permissions:
  contents: write
  actions: write

concurrency:
  group: bangumi-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download popular works and covers
        run: node scripts/sync-bangumi.mjs
      - name: Save catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: bangumi-catalog
          path: public/bangumi/
          retention-days: 7
      - name: Commit catalog and request site deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/bangumi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh popular Bangumi catalog'
          git pull --rebase origin main
          git push origin HEAD:main
          # GITHUB_TOKEN pushes do not trigger another Actions push workflow.
          gh workflow run deploy.yml --ref main
