name: Deploy AstroPaper to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: [".paper-imports/requests/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build AstroPaper
        uses: withastro/action@v6
        with:
          node-version: "24"
          package-manager: pnpm@12.14.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
